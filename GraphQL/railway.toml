# Shared npm-workspaces monorepo — keep Railway Root Directory at `/`.
# In Railway: Settings → Config-as-code path = `/GraphQL/railway.toml`

[build]
builder = "RAILPACK"
buildCommand = "npm install && npm run generate -w @sto-aegis/database"
watchPatterns = [
  "/GraphQL/**",
  "/packages/database/**",
  "/Extractor/**",
  "/package.json",
  "/package-lock.json",
]

[deploy]
# Migrate on start so a restart (no release phase) cannot boot against a stale schema.
startCommand = "npm run migrate:deploy -w @sto-aegis/database && npm run start -w @sto-aegis/graphql"
# Import can take several minutes — keep release from being cut off early.
releaseCommand = "npm run migrate:deploy -w @sto-aegis/database && npm run import:force -w @sto-aegis/extractor"
healthcheckPath = "/graphql"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
