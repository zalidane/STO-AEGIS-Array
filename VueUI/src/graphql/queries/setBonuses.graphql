query SetBonuses {
  setBonuses {
    id
    name
    setPage
    reqItems
    passives
    traySkills
    procs
    abilities
  }
}

query SetBonus($id: Int!) {
  setBonus(id: $id) {
    id
    name
    setPage
    reqItems
    passives
    traySkills
    procs
    abilities
    createdAt
    updatedAt
  }
}

query SetBonusByName($name: String!) {
  setBonusByName(name: $name) {
    id
    name
    setPage
    reqItems
    passives
    traySkills
    procs
    abilities
  }
}
