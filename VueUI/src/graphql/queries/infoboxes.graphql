query Infoboxes {
  infoboxes {
    id
    name
    rarity
    type
    boundto
    boundwhen
    who
    equiplimit
  }
}

query Infobox($id: Int!) {
  infobox(id: $id) {
    id
    name
    rarity
    type
    boundto
    boundwhen
    who
    head1
    head2
    head3
    head4
    head5
    head6
    head7
    head8
    head9
    subhead1
    subhead2
    subhead3
    subhead4
    subhead5
    subhead6
    subhead7
    subhead8
    subhead9
    text1
    text2
    text3
    text4
    text5
    text6
    text7
    text8
    text9
    equiplimit
    createdAt
    updatedAt
    gwLockBoxes {
      id
      cat
      type
      flavor
    }
    swLockBoxes {
      id
      cat
      type
      flavor
    }
    shipsWithConsole {
      id
      name
      tier
    }
  }
}

query InfoboxesByName($name: String!) {
  infoboxesByName(name: $name) {
    id
    name
    rarity
    type
    who
    equiplimit
  }
}
