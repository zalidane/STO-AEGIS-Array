# Shared npm-workspaces monorepo — keep Railway Root Directory at `/`.
# In Railway: Settings → Config-as-code path = `/VueUI/railway.toml`
#
# Set at build time:
#   VITE_GRAPHQL_URL=https://${{GraphQL.RAILWAY_PUBLIC_DOMAIN}}/graphql

[build]
builder = "RAILPACK"
buildCommand = "npm install && npm run build-only -w @sto-aegis/vue-ui"
watchPatterns = [
  "/VueUI/**",
  "/package.json",
  "/package-lock.json",
]

[deploy]
startCommand = "npm run start -w @sto-aegis/vue-ui"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
