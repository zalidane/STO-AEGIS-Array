# Shared npm-workspaces monorepo — keep Railway Root Directory at `/`.
# In Railway: Settings → Config-as-code path = `/VueUI/railway.toml`
#
# Set at build time:
#   VITE_GRAPHQL_URL=https://${{GraphQL.RAILWAY_PUBLIC_DOMAIN}}/graphql
#   VITE_IMAGE_BASE_URL=https://img.aegisarray.com
# Leave VITE_IMAGE_BASE_URL unset until the R2 bucket is verified.
# It is inlined into the client. See docs/image-hosting.md.

[build]
builder = "RAILPACK"
buildCommand = "npm install && npm run build-only -w @sto-aegis/vue-ui"
watchPatterns = [
  "/VueUI/**",
  "/package.json",
  "/package-lock.json",
]

[deploy]
startCommand = "npm run start -w @sto-aegis/vue-ui"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
